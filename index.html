<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f9ff">
<title>休暇時間計算アプリ v2</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
:root{
  --bg:#f3f7fc;--card:#fff;--ink:#10213a;--muted:#6f7f94;--line:#dfe7f1;
  --brand:#1687f8;--brand2:#63bcff;--brand-soft:#eaf5ff;--danger:#e5484d;
  --danger-soft:#fff0f0;--success:#168855;--shadow:0 14px 36px rgba(38,76,120,.10);
  --radius:22px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100dvh;max-width:680px;margin:0 auto;background:linear-gradient(180deg,#f8fbff,#f3f7fc);padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:rgba(248,251,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(223,231,241,.8);padding:calc(12px + env(safe-area-inset-top)) 18px 10px}
.topbar-row{display:flex;align-items:center;gap:10px}
.appmark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-size:21px;box-shadow:0 8px 18px rgba(22,135,248,.22)}
.title-wrap{flex:1;min-width:0}
h1{margin:0;font-size:19px;line-height:1.15}
.version{font-size:11px;color:var(--brand);background:var(--brand-soft);padding:5px 8px;border-radius:999px;font-weight:800}
main{padding:16px}.screen{display:none}.screen.active{display:block}
.card{background:var(--card);border:1px solid rgba(223,231,241,.9);border-radius:var(--radius);box-shadow:var(--shadow)}
.summary{padding:18px;background:linear-gradient(135deg,#e7f5ff,#d9efff 50%,#eff9ff);position:relative;overflow:hidden}
.summary:after{content:"";position:absolute;right:-35px;top:-35px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.36)}
.eyebrow{font-size:13px;color:#2b6ca9;font-weight:800}.total{display:flex;align-items:baseline;flex-wrap:wrap;gap:5px;margin-top:8px;position:relative;z-index:1}
.total .num{font-size:42px;line-height:1;font-weight:900;letter-spacing:-.04em}.total .unit{font-size:17px;font-weight:800;margin-right:4px}
.total-sub{margin-top:10px;color:#607895;font-size:12px;font-weight:700}
.quick-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.stat{background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);border-radius:14px;padding:10px 12px}
.stat-label{font-size:11px;color:#69809a;font-weight:700}.stat-value{font-size:15px;font-weight:900;margin-top:2px}
.section{margin-top:14px;padding:15px}.section-title{font-size:14px;font-weight:900;margin:0 0 12px;display:flex;justify-content:space-between;gap:8px}.section-title small{color:var(--muted);font-weight:600;font-size:11px}
.label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:6px}.field{margin-top:12px}.field:first-child{margin-top:0}
.input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:13px 14px;outline:none;min-height:48px}
.input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(22,135,248,.12)}
textarea{resize:vertical;min-height:84px}.date-row{display:grid;grid-template-columns:1fr auto;gap:8px}.today-btn{border:0;border-radius:14px;background:var(--brand-soft);color:var(--brand);font-weight:900;padding:0 14px}
.type-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.type-btn{border:1px solid var(--line);background:#fff;border-radius:13px;min-height:44px;font-weight:900;color:#5f6f82}
.type-btn.active[data-type="年休"]{background:#fff1f3;border-color:#ffccd4;color:#d7425c}.type-btn.active[data-type="特休"]{background:#eef9f2;border-color:#bce7cb;color:#168855}
.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.timebox{position:relative}.timebox input{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:22px 10px 10px;text-align:center;font-weight:900;font-size:20px;outline:none;min-height:64px}
.timebox span{position:absolute;top:7px;left:10px;font-size:10px;color:var(--muted);font-weight:800}.timebox input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(22,135,248,.12)}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick-btn{border:1px solid #bfe3ff;background:#f2f9ff;color:#0872d4;border-radius:13px;min-height:48px;padding:7px;font-weight:900;line-height:1.15}.quick-btn small{display:block;font-size:9px;color:#6b8ba9;margin-top:2px}
.primary{width:100%;border:0;border-radius:15px;min-height:54px;background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;font-weight:900;font-size:17px;box-shadow:0 10px 24px rgba(22,135,248,.24)}
.secondary-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.secondary{border:1px solid var(--line);background:#fff;color:#52657b;border-radius:13px;min-height:44px;font-weight:800}
.notice{margin-top:10px;font-size:11px;color:var(--muted);line-height:1.55;text-align:center}
.month-card{padding:14px;margin-bottom:12px}.month-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.month-title{font-size:15px;font-weight:900}.month-select{max-width:145px;padding:10px 12px;min-height:42px}
.month-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.month-stat{padding:11px;border-radius:14px;background:#f7fbff;border:1px solid #e1eef9}.month-stat .a{font-size:10px;color:var(--muted);font-weight:800}.month-stat .b{margin-top:3px;font-size:16px;font-weight:900}
.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter-btn{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;color:#65758a;font-weight:800;font-size:12px}.filter-btn.active{background:var(--brand);border-color:var(--brand);color:#fff}
.history-list{display:flex;flex-direction:column;gap:9px}.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:13px}.hist{padding:13px}.hist-top{display:flex;align-items:flex-start;gap:10px}.datebox{min-width:48px;text-align:center}.datebox .md{font-size:17px;font-weight:900}.datebox .dow{font-size:10px;color:var(--muted)}
.hist-main{flex:1;min-width:0}.hist-line{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.pill{font-size:10px;font-weight:900;padding:4px 7px;border-radius:999px}.pill.year{background:#fff1f3;color:#d7425c}.pill.special{background:#eef9f2;color:#168855}.hist-time{font-size:16px;font-weight:900}.hist-min{font-size:10px;color:var(--muted);margin-top:2px}
.hist-cumul{text-align:right;font-size:10px;color:var(--muted);min-width:88px}.hist-cumul strong{display:block;color:var(--ink);font-size:12px;margin-top:3px}.memo{margin-top:8px;font-size:11px;color:#65758a;background:#f8fafc;border-radius:10px;padding:7px 9px;line-height:1.5}.hist-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.icon-btn{border:0;background:#f5f8fc;color:#58708a;border-radius:10px;min-width:48px;min-height:34px;font-weight:800}.icon-btn.danger{background:var(--danger-soft);color:var(--danger)}
.setting-section{margin-top:12px}.setting-head{font-size:12px;color:#54708d;font-weight:900;margin:0 5px 7px}.setting-card{overflow:hidden}.setting-row{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #edf1f6;background:#fff}.setting-row:last-child{border-bottom:0}.setting-icon{width:34px;height:34px;border-radius:10px;background:#eef6ff;color:var(--brand);display:grid;place-items:center;font-size:14px;font-weight:900;flex:0 0 auto}.setting-text{flex:1;min-width:0}.setting-title{font-size:14px;font-weight:900}.setting-sub{font-size:10px;color:var(--muted);margin-top:2px}.setting-select{width:auto;min-width:118px;padding:9px 30px 9px 10px;min-height:40px}
.half-setting{display:grid;grid-template-columns:48px auto 48px auto;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:800}
.half-setting input{width:48px;min-height:38px;border:1px solid var(--line);border-radius:10px;text-align:center;background:#fff;color:var(--ink);font-weight:900}
.dark .half-setting input{background:#162130;color:var(--ink)}
.danger-row .setting-icon{background:var(--danger-soft);color:var(--danger)}.danger-row .setting-title{color:var(--danger)}
.toggle{appearance:none;width:48px;height:28px;background:#dce3ec;border-radius:999px;position:relative;transition:.2s;flex:0 0 auto}.toggle:after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,.15);transition:.2s}.toggle:checked{background:var(--brand)}.toggle:checked:after{transform:translateX(20px)}
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:min(680px,100%);background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.navbtn{border:0;background:transparent;color:#7b8a9d;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:12px;font-size:11px;font-weight:800}.navbtn .ico{font-size:20px}.navbtn.active{color:var(--brand);background:#f0f8ff}
.toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#18324d;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:60}.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(15,30,48,.42);align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(680px,100%);max-height:92dvh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}.sheetbar{width:42px;height:5px;background:#d7dee7;border-radius:999px;margin:0 auto 12px}.sheet h3{margin:0 0 12px;font-size:17px}.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.sheet-actions button{border:0;border-radius:13px;min-height:48px;font-weight:900}.cancel{background:#edf2f7;color:#50657c}.save{background:var(--brand);color:#fff}
body.dark{--bg:#0f1722;--card:#162130;--ink:#f5f8fc;--muted:#9aa9bb;--line:#2b3a4b;--brand-soft:#123454}.dark .app{background:linear-gradient(180deg,#111b28,#0f1722)}.dark .topbar,.dark .bottomnav{background:rgba(17,27,40,.94)}.dark .summary{background:linear-gradient(135deg,#173653,#15304a,#193d59)}.dark .summary .eyebrow,.dark .total-sub{color:#b8d8f2}.dark .stat,.dark .input,.dark select,.dark textarea,.dark .timebox input,.dark .type-btn,.dark .secondary,.dark .filter-btn,.dark .setting-row{background:#162130;color:var(--ink)}.dark .month-stat,.dark .memo{background:#111c29}.dark .quick-btn{background:#102c45;border-color:#234f73;color:#8ac9ff}.dark .sheet{background:#162130}
@media (min-width:681px){body{padding:24px 0}.app{border-radius:28px;overflow:hidden;box-shadow:0 25px 60px rgba(25,54,90,.13)}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="topbar-row">
    <div class="appmark">休</div>
    <div class="title-wrap"><h1>休暇時間計算アプリ</h1></div>
    <span class="version">v2</span>
  </div>
</header>

<main>
<section id="screenInput" class="screen active">
  <div class="card summary">
    <div class="eyebrow">現在の累計</div>
    <div id="totalBig" class="total"></div>
    <div id="totalSub" class="total-sub"></div>
    <div class="quick-stats">
      <div class="stat"><div class="stat-label">今月</div><div id="thisMonthStat" class="stat-value">0分</div></div>
      <div class="stat"><div class="stat-label">登録件数</div><div id="countStat" class="stat-value">0件</div></div>
    </div>
  </div>

  <div class="card section">
    <div class="section-title"><span>休暇を追加</span><small>日付も一緒に保存</small></div>
    <div class="field">
      <label class="label" for="in_date">日付</label>
      <div class="date-row"><input class="input" type="date" id="in_date"><button type="button" class="today-btn" id="todayBtn">今日</button></div>
    </div>
    <div class="field">
      <span class="label">休暇種別</span>
      <div class="type-row" id="typeRow">
        <button type="button" class="type-btn active" data-type="年休">年休</button>
        <button type="button" class="type-btn" data-type="特休">特休</button>
      </div>
    </div>
    <div class="field">
      <span class="label">追加する時間</span>
      <div class="time-grid">
        <div class="timebox"><span>日</span><input type="number" id="in_d" inputmode="numeric" min="0" value="0"></div>
        <div class="timebox"><span>時間</span><input type="number" id="in_h" inputmode="numeric" min="0" value="0"></div>
        <div class="timebox"><span>分</span><input type="number" id="in_m" inputmode="numeric" min="0" value="0"></div>
      </div>
    </div>
    <div class="field">
      <span class="label">クイック入力</span>
      <div class="quick-grid" id="quickGrid"></div>
      <div class="notice" id="halfDayNote"></div>
    </div>
    <div class="field">
      <label class="label" for="in_memo">メモ（任意）</label>
      <textarea id="in_memo" placeholder="例）午後から取得"></textarea>
    </div>
    <div class="field"><button type="button" class="primary" id="addBtn">追加する</button></div>
    <div class="secondary-row">
      <button type="button" class="secondary" id="clearInputBtn">入力クリア</button>
      <button type="button" class="secondary" id="undoBtn">元に戻す</button>
    </div>
  </div>
</section>

<section id="screenHistory" class="screen">
  <div class="card month-card">
    <div class="month-head"><div class="month-title">月別集計</div><input class="input month-select" type="month" id="monthPicker"></div>
    <div class="month-stats">
      <div class="month-stat"><div class="a">この月の累計</div><div class="b" id="monthTotal">0分</div></div>
      <div class="month-stat"><div class="a">登録回数</div><div class="b" id="monthCount">0回</div></div>
    </div>
  </div>
  <div class="filters" id="filters">
    <button type="button" class="filter-btn active" data-filter="すべて">すべて</button>
    <button type="button" class="filter-btn" data-filter="年休">年休</button>
    <button type="button" class="filter-btn" data-filter="特休">特休</button>
  </div>
  <div id="historyList" class="history-list"></div>
</section>

<section id="screenSettings" class="screen">
  <div class="setting-section">
    <div class="setting-head">半日の設定</div>
    <div class="card setting-card">
      <div class="setting-row">
        <div class="setting-icon">年</div>
        <div class="setting-text"><div class="setting-title">年休の半日</div><div class="setting-sub">初期値は4時間。自治体に合わせて自由に変更できます</div></div>
        <div class="half-setting">
          <input type="number" id="annualHalfH" min="0" max="7" inputmode="numeric" aria-label="年休半日の時間"><span>時間</span>
          <input type="number" id="annualHalfM" min="0" max="59" inputmode="numeric" aria-label="年休半日の分"><span>分</span>
        </div>
      </div>
      <div class="setting-row">
        <div class="setting-icon">特</div>
        <div class="setting-text"><div class="setting-title">特休の半日</div><div class="setting-sub">初期値は3時間55分。半日2回で1日として集計します</div></div>
        <div class="half-setting">
          <input type="number" id="specialHalfH" min="0" max="7" inputmode="numeric" aria-label="特休半日の時間"><span>時間</span>
          <input type="number" id="specialHalfM" min="0" max="59" inputmode="numeric" aria-label="特休半日の分"><span>分</span>
        </div>
      </div>
    </div>
  </div>

  <div class="setting-section">
    <div class="setting-head">データ管理</div>
    <div class="card setting-card">
      <button type="button" class="setting-row" id="copyRow" style="width:100%;border:0;text-align:left">
        <div class="setting-icon">複</div><div class="setting-text"><div class="setting-title">累計をコピー</div><div class="setting-sub" id="copySub"></div></div>
      </button>
      <button type="button" class="setting-row" id="exportRow" style="width:100%;border:0;text-align:left">
        <div class="setting-icon">表</div><div class="setting-text"><div class="setting-title">CSVエクスポート</div><div class="setting-sub">履歴を表計算ソフトで開けます</div></div>
      </button>
      <button type="button" class="setting-row" id="backupRow" style="width:100%;border:0;text-align:left">
        <div class="setting-icon">保</div><div class="setting-text"><div class="setting-title">バックアップを書き出す</div><div class="setting-sub">端末変更などに備えて保存できます</div></div>
      </button>
      <button type="button" class="setting-row" id="restoreRow" style="width:100%;border:0;text-align:left">
        <div class="setting-icon">読</div><div class="setting-text"><div class="setting-title">バックアップを読み込む</div><div class="setting-sub">JSONファイルから復元します</div></div>
      </button>
      <button type="button" class="setting-row danger-row" id="resetRow" style="width:100%;border:0;text-align:left">
        <div class="setting-icon">削</div><div class="setting-text"><div class="setting-title">すべてのデータをリセット</div><div class="setting-sub">累計と履歴を削除します</div></div>
      </button>
    </div>
  </div>

  <div class="setting-section">
    <div class="setting-head">表示</div>
    <div class="card setting-card">
      <label class="setting-row">
        <div class="setting-icon">☾</div><div class="setting-text"><div class="setting-title">ダークモード</div><div class="setting-sub">暗い場所で見やすくします</div></div>
        <input class="toggle" type="checkbox" id="darkToggle">
      </label>
    </div>
  </div>
</section>
</main>

<nav class="bottomnav">
  <button type="button" class="navbtn active" data-screen="Input"><span class="ico">＋</span><span>入力</span></button>
  <button type="button" class="navbtn" data-screen="History"><span class="ico">☷</span><span>履歴</span></button>
  <button type="button" class="navbtn" data-screen="Settings"><span class="ico">⚙</span><span>設定</span></button>
</nav>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="editModal">
  <div class="sheet">
    <div class="sheetbar"></div>
    <h3>履歴を編集</h3>
    <input type="hidden" id="edit_id">
    <div class="field"><label class="label" for="edit_date">日付</label><input class="input" type="date" id="edit_date"></div>
    <div class="field"><label class="label" for="edit_type">休暇種別</label><select id="edit_type"><option>年休</option><option>特休</option></select></div>
    <div class="field"><span class="label">時間</span>
      <div class="time-grid">
        <div class="timebox"><span>日</span><input type="number" id="edit_d" min="0"></div>
        <div class="timebox"><span>時間</span><input type="number" id="edit_h" min="0"></div>
        <div class="timebox"><span>分</span><input type="number" id="edit_m" min="0"></div>
      </div>
    </div>
    <div class="field"><label class="label" for="edit_memo">メモ</label><textarea id="edit_memo"></textarea></div>
    <div class="sheet-actions"><button type="button" class="cancel" id="editCancel">キャンセル</button><button type="button" class="save" id="editSave">保存</button></div>
  </div>
</div>

<input type="file" id="restoreFile" accept="application/json,.json" hidden>

<script>
'use strict';

const DAY_MIN = 465;
const KEY_V1 = 'worktime_accum_v1';
const KEY_V2 = 'leave_time_v2';
const SETTINGS_KEY = 'leave_time_v2_settings';
const $ = id => document.getElementById(id);

const DEFAULT_SETTINGS = { dark:false, annualHalf:240, specialHalf:235 };
let selectedType = '年休';
let currentFilter = 'すべて';

function toInt(v){ const n=parseInt(v,10); return Number.isFinite(n) ? Math.max(0,n) : 0; }
function minutesFrom(d,h,m){ return toInt(d)*DAY_MIN + toInt(h)*60 + toInt(m); }
function normalize(mins){
  const t=Math.max(0,Math.round(Number(mins)||0));
  const d=Math.floor(t/DAY_MIN), rem=t-d*DAY_MIN, h=Math.floor(rem/60), m=rem-h*60;
  return {d,h,m};
}
function fmt(mins){ const n=normalize(mins); return `${n.d}日 ${n.h}時間 ${n.m}分`; }
function fmtCompact(mins){
  const n=normalize(mins), parts=[];
  if(n.d) parts.push(`${n.d}日`);
  if(n.h) parts.push(`${n.h}時間`);
  if(n.m || !parts.length) parts.push(`${n.m}分`);
  return parts.join(' ');
}
function fmtHM(mins){
  const t=Math.max(0,Math.round(Number(mins)||0)), h=Math.floor(t/60), m=t%60;
  return m ? `${h}時間${m}分` : `${h}時間`;
}
function todayISO(){
  const d=new Date(), y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function currentMonthISO(){ return todayISO().slice(0,7); }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}_${Math.random()}`); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dowJP(dateStr){ const d=new Date(`${dateStr}T00:00:00`); return ['日','月','火','水','木','金','土'][d.getDay()] || ''; }

function loadSettings(){
  try{
    const obj=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}');
    return {
      dark: !!obj.dark,
      annualHalf: Number.isFinite(Number(obj.annualHalf)) ? Number(obj.annualHalf) : DEFAULT_SETTINGS.annualHalf,
      specialHalf: Number.isFinite(Number(obj.specialHalf)) ? Number(obj.specialHalf) : DEFAULT_SETTINGS.specialHalf
    };
  }catch(e){
    return {...DEFAULT_SETTINGS};
  }
}
function saveSettings(s){ localStorage.setItem(SETTINGS_KEY,JSON.stringify(s)); }

function defaultState(){ return {sum:0,items:[]}; }

function migrateV1(){
  try{
    const raw=localStorage.getItem(KEY_V1);
    if(!raw) return defaultState();
    const old=JSON.parse(raw);
    if(!old || !Array.isArray(old.items)) return defaultState();
    const baseDate=todayISO();
    return {
      sum:0,
      items:old.items.map((it,idx)=>{
        const delta=Number(it.delta)||minutesFrom(it.d,it.h,it.m);
        return {
          id:it.id||uid(),date:baseDate,type:'年休',
          d:toInt(it.d),h:toInt(it.h),m:toInt(it.m),delta,
          specialHalf:false,memo:'',migrated:true,createdAt:Date.now()+idx,cumul:0
        };
      })
    };
  }catch(e){ return defaultState(); }
}
function recalc(st){
  const settings=loadSettings();
  let rawTotal=0, specialHalfCount=0;
  st.items.forEach(it=>{
    if((it.type||'年休')!=='年休' && (it.type||'')!=='特休'){
      it.type='年休';
    }
    const delta=Number(it.delta)||0;
    rawTotal += delta;

    // 特休だけ、設定された「半日」として登録されたデータを2回で1日に補正する。
    if(it.type==='特休' && it.specialHalf===true){
      specialHalfCount++;
    }
    const correction=Math.floor(specialHalfCount/2)*(settings.specialHalf*2-DAY_MIN);
    it.cumul=rawTotal-correction;
  });
  st.sum=st.items.length ? Number(st.items[st.items.length-1].cumul)||0 : 0;
  return st;
}
function loadState(){
  try{
    const raw=localStorage.getItem(KEY_V2);
    if(raw){
      const parsed=JSON.parse(raw);
      if(parsed && Array.isArray(parsed.items)) return recalc(parsed);
    }
    const migrated=recalc(migrateV1());
    saveState(migrated);
    return migrated;
  }catch(e){ return defaultState(); }
}
function saveState(st){ localStorage.setItem(KEY_V2,JSON.stringify(st)); }

function adjustedTotal(items){
  const settings=loadSettings();
  let raw=0, specialHalfCount=0;
  items.forEach(it=>{
    raw += Number(it.delta)||0;
    if(it.type==='特休' && it.specialHalf===true) specialHalfCount++;
  });
  return raw-Math.floor(specialHalfCount/2)*(settings.specialHalf*2-DAY_MIN);
}

function renderSummary(){
  const st=loadState(), n=normalize(st.sum);
  $('totalBig').innerHTML=`<span class="num">${n.d}</span><span class="unit">日</span><span class="num">${n.h}</span><span class="unit">時間</span><span class="num">${n.m}</span><span class="unit">分</span>`;
  $('totalSub').textContent=`合計 ${st.sum.toLocaleString()}分`;
  const thisMonth=st.items.filter(x=>(x.date||'').startsWith(currentMonthISO()));
  $('thisMonthStat').textContent=fmtCompact(adjustedTotal(thisMonth));
  $('countStat').textContent=`${st.items.length}件`;
  $('copySub').textContent=fmt(st.sum);
}

function applyTypeUI(){
  const minuteInput=$('in_m');
  const isAnnual=selectedType==='年休';
  minuteInput.disabled=isAnnual;
  if(isAnnual) minuteInput.value=0;
  minuteInput.style.opacity=isAnnual?'.5':'1';
}

function renderQuickButtons(){
  const s=loadSettings();
  const half=selectedType==='特休' ? s.specialHalf : s.annualHalf;
  const buttons=[
    {kind:'hour',min:60,label:'1時間',sub:''},
    {kind:'half',min:half,label:'半日',sub:fmtHM(half)},
    {kind:'day',min:DAY_MIN,label:'1日',sub:'7時間45分'}
  ];
  $('quickGrid').innerHTML=buttons.map(b=>`<button type="button" class="quick-btn" data-kind="${b.kind}" data-min="${b.min}">${b.label}${b.sub?`<small>${b.sub}</small>`:''}</button>`).join('');
  $('halfDayNote').textContent=selectedType==='特休'
    ? `特休は、半日を2回取得すると1日として集計します。`
    : `年休は、通常どおり7時間45分を1日として集計します。`;
}

function renderHalfSettings(){
  const s=loadSettings();
  $('annualHalfH').value=Math.floor(s.annualHalf/60);
  $('annualHalfM').value=s.annualHalf%60;
  $('specialHalfH').value=Math.floor(s.specialHalf/60);
  $('specialHalfM').value=s.specialHalf%60;
}

function renderHistory(){
  const st=loadState(), month=$('monthPicker').value||currentMonthISO();
  const monthItems=st.items.filter(x=>(x.date||'').startsWith(month));
  $('monthTotal').textContent=fmtCompact(adjustedTotal(monthItems));
  $('monthCount').textContent=`${monthItems.length}回`;

  let items=[...monthItems].sort((a,b)=>(b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
  if(currentFilter!=='すべて') items=items.filter(x=>x.type===currentFilter);

  if(!items.length){
    $('historyList').innerHTML='<div class="card empty">この条件の履歴はまだありません。</div>';
    return;
  }

  $('historyList').innerHTML=items.map(it=>{
    const parts=(it.date||todayISO()).split('-'), m=Number(parts[1]), d=Number(parts[2]);
    const cls=it.type==='特休'?'special':'year';
    const halfMark=it.specialHalf===true ? '・半日' : '';
    return `<div class="card hist">
      <div class="hist-top">
        <div class="datebox"><div class="md">${m}/${d}</div><div class="dow">（${dowJP(it.date||todayISO())}）</div></div>
        <div class="hist-main">
          <div class="hist-line"><span class="pill ${cls}">${esc(it.type||'年休')}${halfMark}</span><span class="hist-time">${esc(fmtCompact(it.delta))}</span></div>
          <div class="hist-min">${Number(it.delta)||0}分</div>
        </div>
        <div class="hist-cumul">登録時の累計<strong>${esc(fmt(it.cumul||0))}</strong></div>
      </div>
      ${it.memo?`<div class="memo">${esc(it.memo)}</div>`:''}
      ${it.migrated?'<div class="memo">v1から引き継いだ履歴のため、日付はv2移行日です。</div>':''}
      <div class="hist-actions">
        <button type="button" class="icon-btn" data-edit="${esc(it.id)}">編集</button>
        <button type="button" class="icon-btn danger" data-delete="${esc(it.id)}">削除</button>
      </div>
    </div>`;
  }).join('');
}

function renderAll(){
  renderHalfSettings();
  renderSummary();
  renderQuickButtons();
  renderHistory();
}

function setQuick(kind,min){
  const n=normalize(min);
  $('in_d').value=n.d; $('in_h').value=n.h; $('in_m').value=n.m;
  $('in_d').dataset.quickKind=kind;
  $('in_h').dataset.quickKind=kind;
  $('in_m').dataset.quickKind=kind;
  toast(`${kind==='half'?'半日':fmtCompact(min)}を入力しました`);
}
function clearQuickMark(){
  delete $('in_d').dataset.quickKind; delete $('in_h').dataset.quickKind; delete $('in_m').dataset.quickKind;
}
function clearInput(){
  $('in_d').value=0; $('in_h').value=0; $('in_m').value=0; $('in_memo').value=''; clearQuickMark();
}
function add(){
  const d=toInt($('in_d').value), h=toInt($('in_h').value), m=toInt($('in_m').value);
  const delta=minutesFrom(d,h,m);
  if(!delta){ alert('追加する時間を入力してください。'); return; }

  const settings=loadSettings();
  const isConfiguredSpecialHalf=selectedType==='特休' && delta===settings.specialHalf;

  const st=loadState();
  st.items.push({
    id:uid(),date:$('in_date').value||todayISO(),type:selectedType,
    d,h,m,delta,specialHalf:isConfiguredSpecialHalf,
    memo:$('in_memo').value.trim(),migrated:false,createdAt:Date.now(),cumul:0
  });
  recalc(st); saveState(st); clearInput(); renderAll(); toast('追加しました');
}
function undo(){
  const st=loadState();
  if(!st.items.length){ toast('戻せる履歴がありません'); return; }
  st.items.pop(); recalc(st); saveState(st); renderAll(); toast('最後の追加を取り消しました');
}
function deleteItem(id){
  const st=loadState(), it=st.items.find(x=>x.id===id);
  if(!it) return;
  if(!confirm(`${it.date} の ${fmtCompact(it.delta)} を削除しますか？`)) return;
  st.items=st.items.filter(x=>x.id!==id);
  recalc(st); saveState(st); renderAll(); toast('削除しました');
}
function openEdit(id){
  const it=loadState().items.find(x=>x.id===id);
  if(!it) return;
  const n=normalize(it.delta);
  $('edit_id').value=id; $('edit_date').value=it.date||todayISO(); $('edit_type').value=it.type||'年休';
  $('edit_d').value=n.d; $('edit_h').value=n.h; $('edit_m').value=n.m; $('edit_memo').value=it.memo||'';
  $('editModal').dataset.wasSpecialHalf=it.specialHalf===true?'1':'0';
  $('editModal').classList.add('show');
}
function saveEdit(){
  const id=$('edit_id').value, st=loadState(), it=st.items.find(x=>x.id===id);
  if(!it) return;
  const d=toInt($('edit_d').value), h=toInt($('edit_h').value), m=toInt($('edit_m').value);
  const delta=minutesFrom(d,h,m);
  if(!delta){ alert('時間を入力してください。'); return; }

  const settings=loadSettings(), type=$('edit_type').value;
  const keepSpecialHalf=type==='特休' && delta===settings.specialHalf;

  Object.assign(it,{
    date:$('edit_date').value||todayISO(),type,d,h,m,delta,
    specialHalf:keepSpecialHalf,memo:$('edit_memo').value.trim(),migrated:false
  });
  recalc(st); saveState(st); $('editModal').classList.remove('show'); renderAll(); toast('履歴を更新しました');
}
function saveHalfSettings(){
  const s=loadSettings();
  const annual=toInt($('annualHalfH').value)*60+Math.min(59,toInt($('annualHalfM').value));
  const special=toInt($('specialHalfH').value)*60+Math.min(59,toInt($('specialHalfM').value));
  if(annual<=0 || special<=0){ alert('半日の時間を正しく入力してください。'); renderHalfSettings(); return; }
  s.annualHalf=annual;
  s.specialHalf=special;
  saveSettings(s);

  // 「特休の半日」として記録済みの履歴は、新しい半日設定に合わせて更新する。
  const st=loadState();
  st.items.forEach(it=>{
    if(it.type==='特休' && it.specialHalf===true){
      it.delta=s.specialHalf;
      const n=normalize(s.specialHalf);
      it.d=n.d; it.h=n.h; it.m=n.m;
    }
  });
  recalc(st);
  saveState(st);
  renderAll();
  toast('半日の設定を保存しました');
}
function copyTotal(){
  const txt=`休暇累計：${fmt(loadState().sum)}`;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('累計をコピーしました')).catch(()=>window.prompt('コピーしてください',txt));
  }else{
    window.prompt('コピーしてください',txt);
  }
}
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),300);
}
function exportCSV(){
  const st=loadState();
  const rows=[['日付','休暇種別','半日扱い','追加（日）','追加（時）','追加（分）','追加合計（分）','累計（日）','累計（時）','累計（分）','メモ']];
  st.items.forEach(it=>{
    const c=normalize(it.cumul||0);
    rows.push([it.date||'',it.type||'年休',it.specialHalf?'はい':'いいえ',it.d||0,it.h||0,it.m||0,it.delta||0,c.d,c.h,c.m,it.memo||'']);
  });
  const csv='\uFEFF'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),`休暇時間履歴_${todayISO()}.csv`);
  toast('CSVを書き出しました');
}
function backup(){
  const data={version:'2.2',exportedAt:new Date().toISOString(),state:loadState(),settings:loadSettings()};
  downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),`休暇時間バックアップ_${todayISO()}.json`);
  toast('バックアップを書き出しました');
}
function restore(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data.state || !Array.isArray(data.state.items)) throw new Error('invalid');
      if(!confirm('現在のデータをバックアップ内容で置き換えます。よろしいですか？')) return;
      if(data.settings) saveSettings({...DEFAULT_SETTINGS,...data.settings});
      saveState(recalc(data.state)); applySettings(); renderAll(); toast('バックアップを復元しました');
    }catch(e){ alert('このバックアップファイルは読み込めません。'); }
  };
  r.readAsText(file);
}
function resetAll(){
  if(!confirm('累計と履歴をすべて削除します。元に戻せません。よろしいですか？')) return;
  saveState(defaultState()); renderAll(); toast('すべてリセットしました');
}
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._timer); toast._timer=setTimeout(()=>t.classList.remove('show'),1800);
}
function switchScreen(name){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  $('screen'+name).classList.add('active');
  document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.screen===name));
  if(name==='History') renderHistory();
}
function applySettings(){
  const s=loadSettings();
  document.body.classList.toggle('dark',s.dark);
  $('darkToggle').checked=s.dark;
}

function init(){
  $('in_date').value=todayISO();
  $('monthPicker').value=currentMonthISO();

  $('todayBtn').addEventListener('click',()=>{$('in_date').value=todayISO();});
  $('typeRow').addEventListener('click',e=>{
    const b=e.target.closest('.type-btn'); if(!b) return;
    selectedType=b.dataset.type;
    document.querySelectorAll('.type-btn').forEach(x=>x.classList.toggle('active',x===b));
    clearQuickMark(); applyTypeUI(); renderQuickButtons();
  });
  $('quickGrid').addEventListener('click',e=>{
    const b=e.target.closest('.quick-btn'); if(!b) return;
    setQuick(b.dataset.kind,Number(b.dataset.min));
  });
  ['in_d','in_h','in_m'].forEach(id=>$(id).addEventListener('input',clearQuickMark));

  $('addBtn').addEventListener('click',add);
  $('clearInputBtn').addEventListener('click',clearInput);
  $('undoBtn').addEventListener('click',undo);

  document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>switchScreen(b.dataset.screen)));
  $('monthPicker').addEventListener('change',renderHistory);
  $('filters').addEventListener('click',e=>{
    const b=e.target.closest('.filter-btn'); if(!b) return;
    currentFilter=b.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(x=>x.classList.toggle('active',x===b));
    renderHistory();
  });
  $('historyList').addEventListener('click',e=>{
    const del=e.target.closest('[data-delete]'), edit=e.target.closest('[data-edit]');
    if(del) deleteItem(del.dataset.delete);
    else if(edit) openEdit(edit.dataset.edit);
  });

  $('editCancel').addEventListener('click',()=>$('editModal').classList.remove('show'));
  $('editSave').addEventListener('click',saveEdit);
  $('editModal').addEventListener('click',e=>{ if(e.target===$('editModal')) $('editModal').classList.remove('show'); });

  ['annualHalfH','annualHalfM','specialHalfH','specialHalfM'].forEach(id=>{
    $(id).addEventListener('change',saveHalfSettings);
  });
  $('copyRow').addEventListener('click',copyTotal);
  $('exportRow').addEventListener('click',exportCSV);
  $('backupRow').addEventListener('click',backup);
  $('restoreRow').addEventListener('click',()=>$('restoreFile').click());
  $('restoreFile').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; if(f) restore(f); e.target.value=''; });
  $('resetRow').addEventListener('click',resetAll);
  $('darkToggle').addEventListener('change',e=>{ const s=loadSettings(); s.dark=e.target.checked; saveSettings(s); applySettings(); });

  document.addEventListener('keydown',e=>{
    if(e.key==='Enter' && $('screenInput').classList.contains('active') && document.activeElement.tagName!=='TEXTAREA') add();
  });

  applySettings();
  applyTypeUI();
  renderAll();
}

init();
</script>
</body>
</html>
